
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوت خدمة العملاء</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      
background: #eaf8ff;

      padding: 30px 15px;
    }
    .chat {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 5px 20px #0001;
    }
    h2 { text-align: center; }
    #messages {
      height: 380px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 16px;
    }
    .bot { background: #dcfce7; }
    .user { background: #dbeafe; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; min-width: 0; padding: 12px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

  
body {
  background: linear-gradient(135deg, #eaf2ff, #f8fafc);
  font-family: Tahoma, Arial, sans-serif;
  min-height: 100vh;
}

.chat {
  max-width: 540px;
  border-radius: 24px;
  padding: 26px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
}

h2 {
  color: #17365d;
  font-size: 24px;
  margin-bottom: 24px;

}

.message {
  max-width: 88%;
  width: fit-content;
  padding: 14px 16px;
  border-radius: 16px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.bot {
  background: #e8f1ff;
  color: #17365d;
  margin-left: auto;
}

.user {
  background: #edf0f5;
  color: #243b53;
  margin-right: auto;
}



button {

background: var(--brand-color, #38bdf8) !important;

  color: #082f49 !important;
  border-radius: 12px;
}


 

button:hover {

background: var(--brand-color, #38bdf8) !important;
filter: brightness(1.1);

}
input {
  border: 1px solid #cbd5e1;
  border-radius: 12px;
}</style>

</head>
<body>
  <div class="chat">
   

<img id="storeLogo" alt="شعار المتجر" style="display:none; width:64px; height:64px; object-fit:contain; margin:0 auto 8px;">

    <h2 id="storeTitle">🤖 مساعد متجر لوري</h2>


<div id="messages">
  <div class="message bot" id="welcomeMessage">
    أهلًا بك في متجر لوري! 💙🛍️ أنا مساعدك الذكي، أقدر أساعدك في المنتجات والأسعار والشحن والاسترجاع. كيف أقدر أخدمك اليوم؟
  </div>
</div>



<div id="quickQuestions" style="display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;">

  <button type="button" onclick="document.getElementById('question').value='ما المنتجات المتوفرة؟'; document.getElementById('chatForm').requestSubmit()">🛍️ المنتجات</button>
  <button type="button" onclick="document.getElementById('question').value='ما أسعار المنتجات؟'; document.getElementById('chatForm').requestSubmit()">💰 الأسعار</button>
  <button type="button" onclick="document.getElementById('question').value='كم تكلفة الشحن ومدة التوصيل؟'; document.getElementById('chatForm').requestSubmit()">🚚 الشحن</button>
  <button type="button" onclick="document.getElementById('question').value='ما سياسة الاسترجاع؟'; document.getElementById('chatForm').requestSubmit()">🔄 الاسترجاع</button>
</div>

<button type="button" onclick="location.reload()">🔄 محادثة جديدة</button>


<button type="button" id="contactAgentBtn" onclick="contactHuman()">👩‍💼 التواصل مع موظف</button>

    <form id="chatForm">
      <input id="question" placeholder="اكتب سؤالك هنا..." required>
      <button type="submit">إرسال</button>
    </form>
  </div>
<script>
const companyId = new URLSearchParams(window.location.search).get("company_id") || "lory-store";

const storeTitle = document.getElementById("storeTitle");
const welcomeMessage = document.getElementById("welcomeMessage");

const quickQuestions = document.getElementById("quickQuestions");

storeTitle.textContent = "🤖 جاري تحميل المتجر...";
welcomeMessage.textContent = "جاري تحميل معلومات المتجر...";

fetch(`https://raw.githubusercontent.com/lorcatwoman222/lory-first-project/lory-development/companies/${encodeURIComponent(companyId)}.json`)
  .then(response => {
    if (!response.ok) throw new Error("Company not found");
    return response.json();
  })
  .then(company => {
    
if (Array.isArray(company.quick_questions) && company.quick_questions.length > 0) {
  quickQuestions.replaceChildren();

  company.quick_questions.forEach((text) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;

    button.onclick = () => {
      document.getElementById("question").value = text;
      document.getElementById("chatForm").requestSubmit();
    };

    quickQuestions.appendChild(button);
  });
}

document.documentElement.style.setProperty("--brand-color", company.brand_color || "#38bdf8");
    
const storeLogo = document.getElementById("storeLogo");

if (company.logo_url) {
  storeLogo.src = company.logo_url;
  storeLogo.style.display = "block";
} else {
  storeLogo.style.display = "none";
}


    
storeTitle.textContent = (company.logo_url ? "" : "🤖 ") + "مساعد " + company.company_name;

    welcomeMessage.textContent = "أهلًا بك في " + company.company_name + "! أنا مساعدك الذكي، كيف أقدر أخدمك اليوم؟";
  })
  .catch(() => {
    storeTitle.textContent = "🤖 المتجر غير متاح";
    welcomeMessage.textContent = "تعذر تحميل معلومات المتجر.";
  });

async function contactHuman() {
  try {
    
const response = await fetch(`https://raw.githubusercontent.com/lorcatwoman222/lory-first-project/lory-development/companies/${encodeURIComponent(companyId)}.json`);
    
    if (!response.ok) throw new Error("Failed");

    const company = await response.json();
    const support = company.human_support;

    if (!support || !support.enabled || !support.url) {
      
alert("🧪 هذه تجربة توضيحية. عند تفعيل الخدمة، سيتم توجيه العميل إلى موظف خدمة العملاء عبر وسيلة التواصل الخاصة بالشركة.");

      return;
    }

    const link = new URL(support.url);
    if (link.protocol !== "https:") throw new Error("Invalid link");

    window.open(link.href, "_blank", "noopener,noreferrer");
  } catch (error) {
    alert("تعذر فتح خدمة العملاء حاليًا.");
  }
}

 
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");

    function showMessage(text, type) {
      const item = document.createElement("div");
      item.className = "message " + type;
      
item.textContent = type === "bot" ? text.replace(/\*\*/g, "") : text;

const timeStamp = document.createElement("div");
timeStamp.textContent = new Date().toLocaleTimeString("ar-SA", {
  hour: "numeric",
  minute: "2-digit",
  hour12: true
});
timeStamp.style.cssText = "font-size: 11px; opacity: 0.65; margin-top: 5px;";
item.appendChild(timeStamp);

if (type === "bot") {
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.textContent = "📋 نسخ الرد";
  copyBtn.style.cssText = "font-size:11px; padding:4px 8px; margin-top:6px;";

  copyBtn.onclick = () => {
    navigator.clipboard.writeText(text.replace(/\*\*/g, ""))
      .then(() => { copyBtn.textContent = "✅ تم النسخ"; })
      .catch(() => { copyBtn.textContent = "تعذر النسخ"; });
  };

  item.appendChild(copyBtn);

const rating = document.createElement("div");
rating.style.cssText = "margin-top:8px; font-size:12px;";
rating.textContent = "هل كان الرد مفيدًا؟ ";

["👍", "👎"].forEach((emoji) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = emoji;
  btn.style.cssText = "padding:4px 8px; margin:3px;";

  btn.onclick = () => {
    rating.textContent = emoji === "👍"
      ? "👍 اخترت: رد مفيد"
      : "👎 اخترت: رد غير مفيد";
  };

  rating.appendChild(btn);
});

item.appendChild(rating);
}

      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

let isSending = false;
const sendButton = form.querySelector('button[type="submit"]');
    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

if (isSending) return;
isSending = true;

sendButton.disabled = true;
sendButton.textContent = "⏳ جاري الرد...";

      showMessage(question, "user");
      input.value = "";

const typingMessage = document.createElement("div");
typingMessage.className = "message bot";
typingMessage.textContent = "💬 جاري كتابة الرد...";
messages.appendChild(typingMessage);
messages.scrollTop = messages.scrollHeight;

      


fetch("https://lory-store-assistant-dev.loryanalsayid.workers.dev/", {

  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  

body: JSON.stringify({ question: question, company_id: companyId })


})
.then(response => {
  if (!response.ok) throw new Error("Request failed");
  return response.json();
})
.then(data => {
typingMessage.remove();

  showMessage(data.answer || "تعذر إنشاء الرد.", "bot");
})

.catch(() => {
  typingMessage.remove();
  showMessage("تعذر الاتصال بالمساعد. حاولي مرة ثانية.", "bot");


}).finally(() => {
  isSending = false;
  sendButton.disabled = false;
  sendButton.textContent = "إرسال";
});



    });
  </script>
</body>
</html>
