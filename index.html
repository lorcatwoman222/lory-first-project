
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوت خدمة العملاء</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 30px 15px;
    }
    .chat {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #0001;
    }
    h2 { text-align: center; }
    #messages {
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
    }
    .bot { background: #dcfce7; }
    .user { background: #dbeafe; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; min-width: 0; padding: 12px; }
    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

  
body {
  background: linear-gradient(135deg, #eaf2ff, #f8fafc);
  font-family: Tahoma, Arial, sans-serif;
  min-height: 100vh;
}

.chat {
  max-width: 540px;
  border-radius: 24px;
  padding: 26px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
}

h2 {
  color: #17365d;
  font-size: 24px;
  margin-bottom: 24px;

.message {
  max-width: 88%;
  width: fit-content;
  padding: 14px 16px;
  border-radius: 16px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.bot {
  background: #e8f1ff;
  color: #17365d;
  margin-left: auto;
}

.user {
  background: #edf0f5;
  color: #243b53;
  margin-right: auto;
}

button {
  background: #2563eb;
  border-radius: 12px;
}

button:hover {
  background: #1d4ed8;
}

input {
  border: 1px solid #cbd5e1;
  border-radius: 12px;
}</style>

</head>
<body>
  <div class="chat">
    <h2>🤖 مساعد الشركة</h2>
    <div id="messages">
      <div class="message bot">
        أهلاً بك! كيف أقدر أساعدك؟
      </div>
    </div>

    <form id="chatForm">
      <input id="question" placeholder="اكتب سؤالك هنا..." required>
      <button type="submit">إرسال</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");

    function showMessage(text, type) {
      const item = document.createElement("div");
      item.className = "message " + type;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      showMessage(question, "user");
      input.value = "";

      

fetch("https://lory-company-assistant.loryanalsayid.workers.dev/", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ question: question })
})
.then(response => {
  if (!response.ok) throw new Error("Request failed");
  return response.json();
})
.then(data => {
  showMessage(data.answer || "تعذر إنشاء الرد.", "bot");
})
.catch(() => {
  showMessage("تعذر الاتصال بالمساعد. حاولي مرة ثانية.", "bot");
});


    });
  </script>
</body>
</html>
