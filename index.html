
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوت خدمة العملاء</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 30px 15px;
    }
    .chat {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #0001;
    }
    h2 { text-align: center; }
    #messages {
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
    }
    .bot { background: #dcfce7; }
    .user { background: #dbeafe; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; min-width: 0; padding: 12px; }
    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat">
    <h2>🤖 مساعد الشركة</h2>
    <div id="messages">
      <div class="message bot">
        أهلاً بك! كيف أقدر أساعدك؟
      </div>
    </div>

    <form id="chatForm">
      <input id="question" placeholder="اكتب سؤالك هنا..." required>
      <button type="submit">إرسال</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");

    function showMessage(text, type) {
      const item = document.createElement("div");
      item.className = "message " + type;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      showMessage(question, "user");
      input.value = "";

      
fetch("./company-info.json")
  .then(response => {
    if (!response.ok) throw new Error("File not found");
    return response.json();
  })
  .then(company => {
    let answer = "ما عندي معلومات عن هذا السؤال.";

    if (/خدمات|تقدمون|تسوون/.test(question)) {
      answer = "خدماتنا: " + company.services.join("، ");
    } else if (/اسم|مين|الشركة/.test(question)) {
      answer = "نحن " + company.company_name + "، " + company.description;
    } else if (/مرحبا|السلام|هلا/.test(question)) {
      answer = "أهلاً بك! كيف أقدر أساعدك؟";
    }

    showMessage(answer, "bot");
  })
  .catch(() => {
    showMessage("تعذر تحميل معلومات الشركة.", "bot");
  });

    });
  </script>
</body>
</html>
